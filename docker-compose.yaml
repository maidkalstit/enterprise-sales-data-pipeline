version: '3.8'

services:
  # ==============================================================================
  # 1. TẦNG LƯU TRỮ DỮ LIỆU (STORAGE LAYER - POSTGRESQL MULTI-DATABASE)
  # ==============================================================================
  postgres-db:
    image: postgres:15-alpine
    container_name: newfolder2-postgres-db-1
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: sales_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432" # Cổng 5433 ra máy Host vật lý, cổng 5432 nội bộ mạng Docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  # ==============================================================================
  # 2. TẦNG HÀNG ĐỢI THÔNG ĐIỆP PHÂN PHỐI (INGESTION QUEUE - APACHE KAFKA)
  # ==============================================================================
  zookeeper:
    image: zookeeper:3.9.2
    container_name: sales_zookeeper
    deploy:
      resources:
        limits:
          memory: 384M

  kafka:
    image: apache/kafka:3.7.0
    container_name: sales_kafka_broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper

  # ==============================================================================
  # 3. TẦNG XỬ LÝ DỮ LIỆU LỚN PHÂN TÁN (COMPUTE ENGINE - APACHE SPARK)
  # ==============================================================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: newfolder2-spark-master-1
    user: root
    command: sh -c "pip install requests python-dotenv pandas faker && /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    ports:
      - "8080:8080" # Giao diện Spark Web UI quản trị
      - "7077:7077" # Cổng phân phối RPC kết nối nội bộ Node
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
      - ./.env:/opt/spark/.env
      - ./logs:/opt/spark/logs
    deploy:
      resources:
        limits:
          memory: 1.5G

  spark-worker:
    image: apache/spark:3.5.0
    user: root
    command: sh -c "pip install requests python-dotenv pandas faker && /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
      - ./.env:/opt/spark/.env
      - ./logs:/opt/spark/logs

  # ==============================================================================
  # 4. TẦNG BÁO CÁO THÔNG MINH TRỰC QUAN HÓA (BI SERVING LAYER - METABASE)
  # ==============================================================================
  metabase:
    image: metabase/metabase:latest
    container_name: metabase_analytics
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_OPTS: "-Xmx1500m"
    volumes:
      - metabase_data:/metabase.db
    deploy:
      resources:
        limits:
          memory: 2G

  # ==============================================================================
  # 5. TẦNG ĐIỀU PHỐI VÀ LẬP LỊCH TÁC VỤ (ORCHESTRATION LAYER - APACHE AIRFLOW)
  # ==============================================================================
  airflow-db:
    image: postgres:15-alpine
    container_name: sales_airflow_metadata_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    deploy:
      resources:
        limits:
          memory: 512M

  airflow-webserver:
    build: 
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sales_airflow_webserver
    user: root
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-tung_dang_dai_nam_2026}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    ports:
      - "8085:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
      - ./.env:/opt/spark/.env
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket phục vụ BashOperator điều phối container chéo
    command: bash -c "chmod 777 /var/run/docker.sock && airflow db init && (airflow users create --username admin --firstname Tung --lastname Dang --role Admin --email tung@dainam.edu.vn --password ${AIRFLOW_ADMIN_PASSWORD:-admin} || true) && airflow webserver"

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sales_airflow_scheduler
    user: root
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
      - ./.env:/opt/spark/.env
      - /var/run/docker.sock:/var/run/docker.sock
    command: bash -c "chmod 777 /var/run/docker.sock && rm -f /opt/airflow/airflow-scheduler.pid && sleep 20 && airflow db migrate && airflow scheduler"

# ==============================================================================
# PHÂN VÙNG LƯU TRỮ KIÊN ĐỊNH (PERSISTENT VOLUMES MAPPING)
# ==============================================================================
volumes:
  postgres_data:
  kafka_data:
  metabase_data: