# =============================================================================
# STACK PIPELINE BÁN HÀNG — MEDALLION / LAMBDA (bản đã sửa theo architecture-review)
# Thay đổi chính so với bản cũ:
#   - BỎ Zookeeper: Kafka 3.7 chạy KRaft (trước đây kéo theo xác chết 384MB RAM)
#   - Spark build từ Dockerfile.spark — dependency pin trong image, không còn
#     `pip install` lúc start (chậm, cần mạng, không tái lập được)
#   - Healthcheck + depends_on condition + restart policy cho toàn stack
#   - Checkpoint streaming nằm trên bind volume ./checkpoints (trước đây nằm
#     trong container → recreate là mất offset)
#   - init-db.sql tự chạy lần đầu khi volume Postgres trống (initdb.d)
#   - Bỏ SPARK_SUBMIT_PARAMETERS (không ai tiêu thụ) và các mount thừa trên Airflow
# =============================================================================

services:

  # 1. TẦNG LƯU TRỮ DỮ LIỆU (POSTGRESQL — MEDALLION)
  postgres-db:
    image: postgres:15-alpine
    container_name: newfolder2-postgres-db-1
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: sales_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema Medallion tự khởi tạo ở lần init đầu tiên khi volume còn trống
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d sales_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # 2. TẦNG HÀNG ĐỢI THÔNG ĐIỆP (KAFKA — KRAFT, KHÔNG CẦN ZOOKEEPER)
  kafka:
    image: apache/kafka:3.7.0
    container_name: sales_kafka_broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # Tạo topic một lần mỗi lần `up` (idempotent) — streaming job khởi động trước
  # producer sẽ không còn gặp lỗi "topic not found" như lần chạy thử đầu tiên
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: sales_kafka_topic_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "/opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic ${KAFKA_TOPIC:-sales_topic} --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1"
    restart: "no"

  # 3. TẦNG XỬ LÝ DỮ LIỆU LỚN (SPARK) — image bake sẵn deps (Dockerfile.spark)
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: sales-spark:3.5.0
    container_name: newfolder2-spark-master-1
    environment:
      - SPARK_MODE=master
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
      - ./.env:/opt/spark/.env
      - ./logs:/opt/spark/logs
      - ./checkpoints:/opt/spark/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep org.apache.spark.deploy.master.Master | grep -v grep"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: sales-spark:3.5.0
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./src:/opt/spark/src
      - ./data:/opt/spark/data
      - ./.env:/opt/spark/.env
      - ./logs:/opt/spark/logs
      - ./checkpoints:/opt/spark/checkpoints
    restart: unless-stopped
    # Worker chỉ idle trong setup này: các job chạy local[*] trên master container
    # (spark-submit không truyền --master) — cap 1G để tiết kiệm RAM cho host 16GB
    deploy:
      resources:
        limits:
          memory: 1G

  # 4. TẦNG BÁO CÁO TRỰC QUAN (METABASE)
  metabase:
    image: metabase/metabase:latest
    container_name: metabase_analytics
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Heap 1G đủ cho dashboard demo — bản 1500m từng chèn áp lực lên host 16GB
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - metabase_data:/metabase.db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M

  # 5. TẦNG ĐIỀU PHỐI TÁC VỤ (AIRFLOW)
  airflow-db:
    image: postgres:15-alpine
    container_name: sales_airflow_metadata_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sales_airflow_webserver
    user: root
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-tung_dang_dai_nam_2026}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    ports:
      - "8085:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    # db migrate thay cho `db init` (deprecated); tái khởi tạo admin nếu chưa có
    command: >
      bash -c "chmod 777 /var/run/docker.sock &&
      airflow db migrate &&
      (airflow users create --username admin --firstname Tung --lastname Dang --role Admin
      --email tung@dainam.edu.vn --password ${AIRFLOW_ADMIN_PASSWORD:-admin} || true) &&
      airflow webserver"
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: sales_airflow_scheduler
    user: root
    depends_on:
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "chmod 777 /var/run/docker.sock &&
      rm -f /opt/airflow/airflow-scheduler.pid &&
      airflow db migrate && airflow scheduler"
    restart: unless-stopped

# ĐỊNH NGHĨA Ổ ĐĨA ẢO (PERSISTENT VOLUMES)
volumes:
  postgres_data:
  kafka_data:
  metabase_data:
